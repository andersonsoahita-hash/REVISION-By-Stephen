<script>
const $=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L="ABCDEFGH",mem={};
const ls={get(k){try{const v=localStorage.getItem(k);return v==null?(mem[k]??null):JSON.parse(v)}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>(Math.round(x*2)/2).toString().replace(".",",");
const S={packFiles:[],lessons:[],lid:null,cards:[],msg:null,docs:[],files:[],repoCourses:[],courses:[],cid:null,qs:[],atts:[],flag:[],tab:"reviser",run:null,draft:{},err:null};
const cur=()=>S.courses.find(c=>c.id===S.cid);
const attsOf=id=>ls.get("rev:"+id+":atts")||[];
const saveAtts=()=>ls.set("rev:"+S.cid+":atts",S.atts.slice(0,200));
const active=()=>S.qs.filter(q=>!S.flag.includes(q.id));
function lastByQ(){const m={};for(const a of S.atts)for(const it of a.items||[])if(!(it.qid in m))m[it.qid]=it.f;return m}
const mastered=(q,m)=>q.id in m&&m[q.id]>=(q.type==="open"?.75:.99);
function chapters(){const m={};active().forEach(q=>{(m[q.chapter||"Général"]??=[]).push(q)});return m}
function loadCourses(){
  const seen=ls.get("rev:seen")||{};let ch=false;S.repoCourses.forEach(c=>{if(!(c.id in seen)){seen[c.id]=c.version||1;ch=true}});if(ch)ls.set("rev:seen",seen);S.seen=seen;
  S.courses=[...S.repoCourses,...(ls.get("rev:courses")||[]).map(c=>({...c,user:true}))]}
const PROMPT_PACK=`Tu es un assistant pédagogique pour un étudiant en MSc Marketing, Communication et Stratégie de Marque. À partir UNIQUEMENT du cours ci-dessous, construis un « pack de cours » au format JSON, pour une application de révision.

Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, de cette forme :
{
 "format":"carnet-pack-1",
 "id":"nom-court-sans-espace",
 "name":"Nom du cours",
 "version":1,
 "lessons":[ {"id":"roles","seance":"Séance 1","title":"Titre de la leçon","chapters":["Nom de chapitre"],"intro":"1 à 2 phrases","items":[{"t":"Notion","d":"Explication fidèle au cours","ex":"Exemple du cours (facultatif)","key":"À retenir ou piège (facultatif)"}],"take":"La leçon en une phrase"} ],
 "questions":[ {"type":"qcm","chapter":"Nom de chapitre","level":"appliquer","q":"…","options":["…","…","…","…"],"answer":[2],"why":"…"}, {"type":"multi","chapter":"…","level":"comprendre","q":"…","options":["…","…","…","…","…"],"answer":[0,3],"why":"…"}, {"type":"open","chapter":"…","level":"appliquer","q":"…","points":["…","…","…"],"model":"…","why":"…"} ],
 "cards":[ {"chapter":"Nom de chapitre","front":"Notion ou question","back":"Réponse courte avec exemple"} ]
}

Règles :
- Une leçon par grande section du cours (une section = une page de leçon). Chaque leçon contient toutes les notions de la section, avec les exemples du cours.
- "chapters" d'une leçon = les noms de chapitre utilisés dans les questions et cartes de cette leçon (mêmes noms, écrits à l'identique).
- Au moins 8 questions par leçon : environ 60 % de QCM à une bonne réponse (4 options), 20 % de QCM à plusieurs bonnes réponses (5 options), 20 % de questions ouvertes. Au moins la moitié en mise en situation. Mauvaises réponses plausibles. "answer" = numéros d'options en commençant à 0. "why" explique la bonne réponse en 2 à 3 phrases.
- Au moins 5 cartes par leçon.
- N'invente rien : tout vient du cours.

COURS :
[colle ici le texte du cours]`;
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function normLesson(x){
  if(!x||!x.title||!Array.isArray(x.items)||!x.items.length)return null;
  return {id:String(x.id||"l"+hash(String(x.title))),seance:String(x.seance||"Cours"),title:String(x.title),chapters:Array.isArray(x.chapters)?x.chapters.map(String):[],intro:String(x.intro||""),
    items:x.items.map(i=>({t:String(i.t||""),d:String(i.d||""),ex:String(i.ex||""),key:String(i.key||"")})).filter(i=>i.t||i.d),take:String(x.take||"")};
}
function normCard(x){return x&&x.front&&x.back?{id:String(x.id||"k"+hash(String(x.front))),chapter:String(x.chapter||"Général"),front:String(x.front),back:String(x.back)}:null}
function importPack(p){
  if(!p||typeof p!=="object"||Array.isArray(p))throw new Error("Fichier de cours invalide.");
  const name=String(p.name||"").trim();if(!name)throw new Error("Le fichier n'a pas de nom de cours (champ \"name\").");
  const lessons=(p.lessons||[]).map(normLesson).filter(Boolean);
  const questions=(p.questions||[]).map(x=>{const q=normQ(x);if(q){q.id=String(x.id||"p"+hash(q.q));q.source="pack"}return q}).filter(Boolean);
  const cards=(p.cards||[]).map(normCard).filter(Boolean);
  if(!lessons.length&&!questions.length&&!cards.length)throw new Error("Le fichier ne contient ni leçon, ni question, ni carte.");
  let id=String(p.id||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,60)||"p"+hash(name);
  if(S.repoCourses.some(c=>c.id===id))id+="-perso";
  const list=ls.get("rev:courses")||[];let c=list.find(x=>x.id===id);const isNew=!c;
  const old=ls.get("rev:"+id+":pack")||{lessons:[],questions:[],cards:[]};
  const mergeBy=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));let add=0;b.forEach(x=>{if(!m.has(x.id))add++;m.set(x.id,x)});return [[...m.values()],add]};
  const [L2,al]=mergeBy(old.lessons,lessons),[Q2,aq]=mergeBy(old.questions,questions),[C2,ac]=mergeBy(old.cards,cards);
  if(!ls.set("rev:"+id+":pack",{lessons:L2,questions:Q2,cards:C2,version:p.version||1}))throw new Error("Le stockage du navigateur est plein.");
  if(isNew)list.push({id,name,version:p.version||1});else{c.name=name;c.version=p.version||1}
  ls.set("rev:courses",list);loadCourses();
  return {name,isNew,al,aq,ac};
}
async function doPackImport(){
  if(!S.packFiles.length){S.msg={t:"warn",m:"Choisis un fichier de cours."};return render()}
  S.msg={t:"ok",m:"Import en cours…"};render();
  const out=[];
  try{
    for(const file of S.packFiles){
      const ext=file.name.split(".").pop().toLowerCase();
      if(ext==="json"){
        let obj;try{obj=JSON.parse(await file.text())}catch(e){throw new Error(file.name+" n'est pas un JSON valide.")}
        const r=importPack(obj);
        out.push(r.isNew?`« ${r.name} » créé : ${r.al} leçon(s), ${r.aq} question(s), ${r.ac} carte(s).`:`« ${r.name} » mis à jour : ${r.al} nouvelle(s) leçon(s), ${r.aq} nouvelle(s) question(s), ${r.ac} nouvelle(s) carte(s). Ta progression est conservée.`);
      }else{
        const blocks=toBlocks(await extract(file));if(!blocks.length)throw new Error(file.name+" : aucun texte trouvé");
        const id="c"+Date.now().toString(36)+hash(file.name),list=ls.get("rev:courses")||[];
        list.push({id,name:file.name.replace(/\.[^.]+$/,"")});ls.set("rev:courses",list);
        ls.set("rev:"+id+":docs",[{id:"d"+Date.now().toString(36),name:file.name,blocks}]);loadCourses();
        out.push(`« ${file.name} » ajouté comme cours avec ${blocks.length} blocs. Ouvre-le pour créer des questions.`);
      }
    }
    S.packFiles=[];S.msg={t:"ok",m:out.join(" ")};
  }catch(e){S.msg={t:"warn",m:(out.length?out.join(" ")+" ":"")+(e.message||String(e))};S.packFiles=[]}
  render();
}
async function checkUpdates(){
  S.msg={t:"ok",m:"Vérification…"};render();
  try{
    const r=await fetch("courses/index.json?t="+Date.now(),{cache:"no-store"});S.repoCourses=await r.json();loadCourses();
    const news=S.repoCourses.filter(c=>(c.version||1)>(S.seen[c.id]||0));
    S.msg={t:"ok",m:news.length?"Mise à jour disponible : "+news.map(c=>c.name).join(", ")+". Ouvre le cours pour la charger.":"Tout est à jour."};
  }catch(e){S.msg={t:"warn",m:"Impossible de vérifier. Es-tu connecté ?"}}
  render();
}
function newCourse(){
  const n=(S.draft.newName||"").trim();if(!n)return;
  const id="c"+Date.now().toString(36),list=ls.get("rev:courses")||[];list.push({id,name:n});ls.set("rev:courses",list);
  S.draft.newName="";loadCourses();openCourse(id).then(()=>{S.tab="cours";render()});
}
function delCourse(){
  const id=S.cid;ls.set("rev:courses",(ls.get("rev:courses")||[]).filter(c=>c.id!==id));
  ["atts","flag","custom","docs","cards","box","pack"].forEach(k=>{try{localStorage.removeItem("rev:"+id+":"+k)}catch(e){}delete mem["rev:"+id+":"+k]});
  S.cid=null;S.run=null;loadCourses();render();
}
async function openCourse(id){
  {const c=S.courses.find(x=>x.id===id);if(c&&!c.user){const sn=ls.get("rev:seen")||{};sn[id]=c.version||1;ls.set("rev:seen",sn);S.seen=sn}}
  S.cid=id;S.run=null;S.tab="reviser";S.err=null;S.qs=[];
  S.atts=attsOf(id);S.flag=ls.get("rev:"+id+":flag")||[];render();
  let base=[];S.docs=ls.get("rev:"+id+":docs")||[];S.msg=null;
  if(!cur().user){try{const r=await fetch("courses/"+id+"/questions.json",{cache:"no-cache"});base=await r.json()}catch(e){S.err="Impossible de charger les questions."}}else base=(ls.get("rev:"+id+":pack")||{}).questions||[];
  let bc=[];if(!cur().user){try{const r=await fetch("courses/"+id+"/cards.json",{cache:"no-cache"});if(r.ok)bc=await r.json()}catch(e){}}else bc=(ls.get("rev:"+id+":pack")||{}).cards||[];
  let bl=[];if(!cur().user){try{const r=await fetch("courses/"+id+"/lessons.json",{cache:"no-cache"});if(r.ok)bl=await r.json()}catch(e){}}else bl=(ls.get("rev:"+id+":pack")||{}).lessons||[];
  S.lessons=bl;S.lid=null;
  S.cards=[...bc,...(ls.get("rev:"+id+":cards")||[])];
  S.qs=[...base,...(ls.get("rev:"+id+":custom")||[])];
  render();
}
const PROMPT=`Tu es examinateur en MSc Marketing, Communication et Stratégie de Marque. À partir UNIQUEMENT du cours ci-dessous, écris 15 questions d'examen en français.
Règles : environ 60 % de QCM à une seule bonne réponse ("qcm", 4 options), 20 % de QCM à plusieurs bonnes réponses ("multi", 5 options, 2 à 3 bonnes), 20 % de questions ouvertes ("open"). Au moins la moitié en mise en situation ("level":"appliquer"). Mauvaises réponses plausibles. "why" explique la bonne réponse en 2 à 3 phrases. "chapter" est le nom court de la partie du cours.
Réponds UNIQUEMENT par un tableau JSON, sans texte autour. Formes :
{"type":"qcm","chapter":"…","level":"appliquer","q":"…","options":["…","…","…","…"],"answer":[2],"why":"…"}
{"type":"multi","chapter":"…","level":"comprendre","q":"…","options":["…","…","…","…","…"],"answer":[0,3],"why":"…"}
{"type":"open","chapter":"…","level":"appliquer","q":"…","points":["…","…","…"],"model":"…","why":"…"}
(answer = numéros d'options, en commençant à 0)

COURS :
[colle ici le texte du cours]`;
function normQ(x){
  if(!x||typeof x.q!=="string"||!x.q.trim())return null;
  const type=["qcm","multi","open"].includes(x.type)?x.type:"qcm";
  const o={type,chapter:String(x.chapter||"Général").slice(0,80),level:x.level==="appliquer"?"appliquer":"comprendre",q:x.q.trim(),why:String(x.why||"").trim()};
  if(type==="open"){if(!Array.isArray(x.points)||x.points.length<2)return null;o.points=x.points.map(String);o.model=String(x.model||"");return o}
  if(!Array.isArray(x.options)||x.options.length<3||x.options.length>6)return null;
  o.options=x.options.map(String);
  const a=(Array.isArray(x.answer)?x.answer:[x.answer]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<o.options.length);
  if(!a.length||(type==="qcm"&&a.length!==1)||(type==="multi"&&a.length<2))return null;
  o.answer=[...new Set(a)];return o;
}
function importQ(){
  let t=(S.draft.impJson||"").trim();
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1];
  const i=t.indexOf("["),j=t.lastIndexOf("]");if(i>=0&&j>i)t=t.slice(i,j+1);
  let arr;try{arr=JSON.parse(t)}catch(e){S.msg={t:"warn",m:"Ce texte n'est pas du JSON valide. Redemande à l'IA « uniquement le tableau JSON »."};return render()}
  const have=new Set(S.qs.map(q=>q.q.trim().toLowerCase()));
  const ok=(Array.isArray(arr)?arr:[]).map(normQ).filter(q=>q&&!have.has(q.q.toLowerCase()));
  if(!ok.length){S.msg={t:"warn",m:"Aucune question valide ou nouvelle dans ce texte."};return render()}
  const custom=ls.get("rev:"+S.cid+":custom")||[];
  ok.forEach((q,k)=>{q.id="u"+Date.now().toString(36)+k;q.source="import"});
  ls.set("rev:"+S.cid+":custom",[...custom,...ok]);S.qs=[...S.qs,...ok];S.draft.impJson="";
  S.msg={t:"ok",m:ok.length+" question"+(ok.length>1?"s":"")+" ajoutée"+(ok.length>1?"s":"")+"."};render();
}
const mk=q=>({q,order:shuffle(q.options.map((_,i)=>i)),picks:[]});
function pick(n){
  const m=lastByQ(),seen={};S.atts.forEach(a=>(a.items||[]).forEach(i=>seen[i.qid]=1));
  const pr=q=>(!(q.id in seen)?0:m[q.id]<.99?1:2)+Math.random()*.9;
  return active().filter(q=>q.type!=="open").map(q=>[pr(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);
}
function start(qs,exam){
  if(!qs.length){S.err="Aucune question QCM disponible.";return render()}
  S.err=null;S.run={kind:"test",exam,items:shuffle(qs).map(mk),i:0,phase:"answer"};render();
}
function score(q,picks){
  const a=q.answer;if(q.type==="qcm")return picks[0]===a[0]?1:0;
  const g=picks.filter(p=>a.includes(p)).length,b=picks.length-g;
  return b===0&&g===a.length?1:Math.max(0,(g-b)/a.length)*.99;

const STOP=new Set("pourquoi comment quelle quelles lequel lesquels cependant également notamment ainsi alors puisque lorsque entre depuis pendant toujours plusieurs différents différentes certains certaines chaque quelque comme tout tous toutes aussi autres avoir faire séance slide exemple exemples".split(" "));
const words=s=>s.match(/[A-Za-zÀ-ÿ'-]{7,}/g)||[];
function toBlocks(text){
  const parts=text.replace(/\r/g,"").split(/\n\s*\n+|\[Page \d+\]/).map(x=>x.replace(/\s+/g," ").trim()).filter(x=>x.length>20);
  const out=[];let cur="";
  for(const p of parts){cur=cur?cur+" "+p:p;if(cur.length>=400){out.push(cur);cur=""}}
  if(cur)out.push(cur);
  const fin=[];for(const b of out){if(b.length<=1500){fin.push(b);continue}let t=b;while(t.length>1500){let i=t.lastIndexOf(". ",1500);if(i<600)i=1500;fin.push(t.slice(0,i+1).trim());t=t.slice(i+1).trim()}if(t)fin.push(t)}
  return fin;
}
async function extract(file){
  const ext=file.name.split(".").pop().toLowerCase();
  if(["txt","md","csv"].includes(ext))return await file.text();
  if(ext==="docx"){if(!window.mammoth)throw new Error("Lecteur Word indisponible (connexion ?)");return (await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}
  if(ext==="pdf"){
    if(!window.pdfjsLib)throw new Error("Lecteur PDF indisponible (connexion ?)");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let out="";for(let p=1;p<=pdf.numPages;p++){const t=await (await pdf.getPage(p)).getTextContent();out+=`\n[Page ${p}]\n`+t.items.map(i=>i.str).join(" ")}
    if(out.replace(/\[Page \d+\]|\s/g,"").length<pdf.numPages*40)throw new Error("Ce PDF semble être un scan sans texte. Colle le texte ou exporte-le en Word.");
    return out;
  }
  throw new Error("Format non pris en charge : "+ext);
}

function genCloze(n){
  const sents=[];S.docs.forEach(d=>d.blocks.forEach(b=>(b.match(/[^.!?]+[.!?]/g)||[]).forEach(x=>{x=x.trim();if(x.length>=50&&x.length<=230)sents.push({s:x,doc:d.name})})));
  const vocab=[...new Set(sents.flatMap(x=>words(x.s).map(w=>w.toLowerCase())))].filter(w=>!STOP.has(w));
  const have=new Set(S.qs.map(q=>q.why));const out=[];
  if(vocab.length<8)return out;
  for(const x of shuffle(sents)){
    if(out.length>=n)break;if(have.has("Extrait du cours : « "+x.s+" »"))continue;
    const ws=words(x.s).filter(w=>!STOP.has(w.toLowerCase()));if(!ws.length)continue;
    const t=ws[Math.floor(Math.random()*ws.length)],tl=t.toLowerCase();
    const dis=shuffle(vocab.filter(w=>w!==tl&&!x.s.toLowerCase().includes(w)&&Math.abs(w.length-tl.length)<=3)).slice(0,3);
    if(dis.length<3)continue;
    const opts=shuffle([tl,...dis]);
    out.push({id:"a"+Date.now().toString(36)+out.length,type:"qcm",chapter:x.doc,level:"comprendre",q:"Complète l'extrait du cours : « "+x.s.replace(t,"_____")+" »",options:opts,answer:[opts.indexOf(tl)],why:"Extrait du cours : « "+x.s+" »",source:"auto"});
  }
  return out;
}

    <label class="label" for="impJson">Réponse de l'IA (JSON)</label><textarea id="impJson" placeholder="[ { &quot;type&quot;: &quot;qcm&quot;, … } ]">${esc(S.draft.impJson||"")}</textarea>
    <div class="row"><button class="btn primary" data-act="importq">Ajouter les questions</button></div>
    <p class="small muted">Elles sont enregistrées dans ce navigateur (${mine} importée${mine>1?"s":""}). Vérifie-les : une IA peut se tromper, et le bouton « Signaler » les retire des tests. Pour les garder à vie dans le dépôt, envoie-les-moi.</p>
    ${mine?'<p class="small"><button class="btn link small" data-act="copymine">Copier mes questions importées</button> · <button class="btn link small" data-act="delmine">Supprimer mes questions importées</button></p>':""}</div>`}
  else if(S.tab==="questions"){const ch=chapters();body=`<div class="card"><h2>Banque (${S.qs.length})</h2>${Object.keys(ch).map(n=>`<details><summary>${esc(n)} · ${ch[n].length}</summary>${ch[n].map(q=>`<div style="padding:10px 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px"><div>${esc(q.q)}</div>${q.type==="open"?`<div class="small muted">Attendu : ${q.points.map(esc).join(" · ")}</div>`:`<div class="small muted">Bonne réponse : ${q.answer.map(i=>esc(q.options[i])).join(" / ")}</div>`}<button class="btn link small" data-act="flag" data-id="${esc(q.id)}">Signaler une erreur (sort des tests)</button></div>`).join("")}</details>`).join("")}${S.flag.length?`<p class="small muted" style="margin-top:10px">${S.flag.length} question(s) signalée(s). <button class="btn link small" data-act="unflag">Les remettre</button></p>`:""}</div>`}
  else body=S.atts.length?`<div class="card"><h2>Historique</h2>${S.atts.map(a=>`<div class="hist"><span class="mono small muted">${new Date(a.at).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})}</span><span>${a.mode==="open"?"Question ouverte":(a.exam?"Examen blanc · ":"")+a.n+" QCM"}${a.retry?` · ${a.retry.fixed}/${a.retry.total} erreurs corrigées`:""}</span><span class="mono" style="font-weight:600">${fmt(a.score20)}/20</span></div>`).join("")}<p class="small muted" style="margin-top:10px"><button class="btn link small" data-act="reset">Effacer ma progression</button></p></div>`:'<div class="card"><p class="muted">Aucun test pour l\'instant.</p></div>';
  return `<div class="top"><button class="btn link" data-act="home">← Tous les cours</button>${c.user?'<span class="small muted">Pour mettre à jour : importe le nouveau fichier de cours sur l\'accueil.</span>':'<button class="btn" data-act="updcourse">Mettre à jour ce cours</button>'}</div><header><p class="label">Cours</p><h1>${esc(c.name)}</h1></header>
  ${S.err?`<div class="warnbox">${esc(S.err)}</div>`:""}
  <div class="card stats"><div class="stat"><span class="label">Questions</span><b>${qs.length}</b></div><div class="stat"><span class="label">Maîtrisées</span><b>${ms}<span class="muted" style="font-size:1rem">/${qs.length}</span></b></div><div class="stat"><span class="label">Moyenne (5 derniers)</span><b>${avg==null?"–":fmt(avg)}</b></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-k="${k}">${t}</button>`).join("")}</div>${body}`;
}
function quiz(){
  const r=S.run,it=r.items[r.i],q=it.q,last=r.i===r.items.length-1;
  return `<div class="top"><button class="btn link" data-act="quit">← Quitter</button><span class="mono small muted">${r.kind==="retry"?"Correction · ":""}${r.i+1} / ${r.items.length}</span></div><div class="bar"><i style="width:${(r.i+1)/r.items.length*100}%"></i></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px"><div class="row"><span class="pill">${esc(q.chapter||"Général")}</span>${q.type==="multi"?'<span class="pill">Plusieurs réponses possibles</span>':""}</div><p class="qtext">${esc(q.q)}</p>
  <div class="opts">${it.order.map((oi,p)=>`<button class="opt" data-act="pick" data-oi="${oi}" aria-pressed="${it.picks.includes(oi)}"><span class="k">${L[p]}</span><span>${esc(q.options[oi])}</span></button>`).join("")}</div>
  <div class="row" style="justify-content:space-between"><button class="btn" data-act="prev" ${r.i===0?"disabled":""}>Précédente</button><button class="btn primary" data-act="${last?"finish":"next"}" ${it.picks.length?"":"disabled"}>${last?"Terminer et voir ma note":"Suivante"}</button></div></div>`;
}
function result(){
  const r=S.run,wrong=r.items.map((it,i)=>[it,r.res[i]]).filter(([,x])=>x.f<.99);
  const head=r.kind==="test"?`<div class="card" style="display:flex;flex-direction:column;gap:14px"><span class="label">${r.exam?"Examen blanc · ":""}Ta note</span><div class="note">${fmt(r.note)}<small> /20</small></div>
   <p class="muted">${wrong.length?`${wrong.length} question${wrong.length>1?"s":""} à reprendre sur ${r.res.length}.`:"Sans faute."}</p>
   ${Object.keys(r.chap).map(k=>{const [s,t]=r.chap[k];return `<div class="chap"><span class="name">${esc(k)}</span><span class="mono small" style="text-align:right">${Math.round(s*10)/10}/${t}</span><div class="bar" style="grid-column:1/-1"><i style="width:${s/t*100}%"></i></div></div>`}).join("")}
   <div class="row">${wrong.length&&!r.retryUsed?'<button class="btn primary" data-act="retry">Corriger mes erreurs (1 essai)</button>':""}<button class="btn" data-act="${r.exam?"exam":"test"}" data-n="${r.items.length}">Nouveau test</button><button class="btn" data-act="quit">Retour au cours</button></div></div>`
  :`<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="label">Après correction</span><div class="note">${r.fixed}<small> / ${r.res.length} corrigées</small></div><p class="muted">${wrong.length?"Relis les explications puis refais un test : d'autres questions te seront posées.":"Tout est corrigé."}</p><div class="row"><button class="btn primary" data-act="test" data-n="10">Nouveau test</button><button class="btn" data-act="quit">Retour au cours</button></div></div>`;
  return head+(wrong.length?"<h2>Où tu t'es trompé</h2>":"")+wrong.map(([it,x])=>{const q=it.q;return `<div class="fix"><div class="row"><span class="pill bad">${x.f>0?"Incomplet":"Faux"}</span><span class="pill">${esc(q.chapter||"Général")}</span></div><p><b>${esc(q.q)}</b></p>
  <div class="ans-line"><span class="small muted">Ta réponse :</span><span>${x.picks.length?x.picks.map(i=>esc(q.options[i])).join(" / "):"aucune"}</span></div>
  <div class="ans-line"><span class="small muted">Réponse attendue :</span><b>${q.answer.map(i=>esc(q.options[i])).join(" / ")}</b></div><p class="small">${esc(q.why||"")}</p></div>`}).join("");
}
function openView(){
  const r=S.run,q=r.q,top=`<div class="top"><button class="btn link" data-act="quit">← Quitter</button><span class="pill">${esc(q.chapter||"Général")}</span></div>`;
  if(r.phase==="answer")return `${top}<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="label">Question ouverte</span><p class="qtext">${esc(q.q)}</p><textarea id="openAns" placeholder="Rédige comme à l'examen…">${esc(S.draft.openAns||"")}</textarea><div class="row"><button class="btn primary" data-act="reveal">Voir la réponse modèle et m'auto-évaluer</button></div></div>`;
  if(r.phase==="check")return `${top}<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="label">Auto-évaluation</span><p class="qtext">${esc(q.q)}</p><div class="fix ok"><b>Réponse modèle</b><p>${esc(q.model)}</p></div>
   <p>Coche les éléments que ta réponse contenait :</p>${q.points.map((p,i)=>`<label class="opt" style="cursor:pointer"><input type="checkbox" data-chk="${i}" ${r.checked.includes(i)?"checked":""}><span>${esc(p)}</span></label>`).join("")}<div class="row"><button class="btn primary" data-act="valid">Valider ma note</button></div></div>`;
  const f=r.checked.length/q.points.length;
  return `${top}<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="label">Ta note</span><div class="note">${fmt(f*20)}<small> /20</small></div><p class="muted">Les éléments non cochés sont à revoir dans le cours.</p><div class="row"><button class="btn" data-act="open-q">Autre question ouverte</button><button class="btn" data-act="quit">Retour au cours</button></div></div>`;
}
function render(){
  $.innerHTML=!S.cid?home():S.run&&S.run.kind==="cards"?cardsView():S.run&&S.run.kind==="open"?openView():S.run&&S.run.phase==="answer"?quiz():S.run&&S.run.phase==="result"?result():course();
}
document.addEventListener("input",e=>{if(e.target.id)S.draft[e.target.id]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="packIn"){S.packFiles=Array.from(e.target.files);S.msg=null;render();return}
  if(e.target.id==="fileIn"){S.files=Array.from(e.target.files);render();return}
  const i=e.target.dataset&&e.target.dataset.chk;if(i!=null&&S.run){const n=Number(i),c=S.run.checked;S.run.checked=e.target.checked?[...new Set([...c,n])]:c.filter(x=>x!==n)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  if(a==="open")openCourse(d.id);
  else if(a==="home"){S.cid=null;S.run=null;render()}
  else if(a==="tab"){S.tab=d.k;S.err=null;S.msg=null;if(d.k!=="lecons")S.lid=null;render()}
  else if(a==="importq")importQ();
  else if(a==="packimport")doPackImport();
  else if(a==="checkupd")checkUpdates();
  else if(a==="copypack"){navigator.clipboard.writeText(PROMPT_PACK).then(()=>{b.textContent="Consigne copiée"}).catch(()=>{b.textContent="Copie impossible"})}
  else if(a==="updcourse"){const t=S.tab;openCourse(S.cid).then(()=>{S.tab=t;S.msg={t:"ok",m:"Cours rechargé depuis GitHub."};render()})}
  else if(a==="lesson"){S.lid=d.id;S.tab="lecons";render();window.scrollTo(0,0)}
  else if(a==="lessons"){S.lid=null;render();window.scrollTo(0,0)}
  else if(a==="lessonquiz"){const l=S.lessons.find(x=>x.id===S.lid);start(active().filter(q=>q.type!=="open"&&l.chapters.includes(q.chapter)),false)}
  else if(a==="cards")startCards(Number(d.n)||10);
  else if(a==="cflip"){S.run.flip=true;render()}
  else if(a==="cknow")rateCard(true);
  else if(a==="cmiss")rateCard(false);
  else if(a==="addcard"){const f=(S.draft.cf||"").trim(),bk=(S.draft.cb||"").trim();if(!f||!bk){S.msg={t:"warn",m:"Il faut un recto et un verso."};return render()}
    const l=ls.get("rev:"+S.cid+":cards")||[],card={id:"u"+Date.now().toString(36),chapter:(S.draft.cch||"").trim()||"Mes cartes",front:f,back:bk};l.push(card);ls.set("rev:"+S.cid+":cards",l);S.cards.push(card);S.draft.cf="";S.draft.cb="";S.msg={t:"ok",m:"Carte ajoutée."};render()}
  else if(a==="delcards"){if(b.dataset.sure){const ids=(ls.get("rev:"+S.cid+":cards")||[]).map(x=>x.id);ls.set("rev:"+S.cid+":cards",[]);S.cards=S.cards.filter(x=>!ids.includes(x.id));render()}else{b.dataset.sure="1";b.textContent="Cliquer encore pour confirmer"}}
  else if(a==="newcourse")newCourse();
  else if(a==="delcourse"){if(b.dataset.sure)delCourse();else{b.dataset.sure="1";b.textContent="Cliquer encore pour confirmer"}}
  else if(a==="import")doImport();
  else if(a==="delblk"){const dd=S.docs.find(x=>x.id===d.d);if(dd){dd.blocks.splice(Number(d.b),1);if(!dd.blocks.length)S.docs=S.docs.filter(x=>x!==dd);ls.set("rev:"+S.cid+":docs",S.docs);render()}}
  else if(a==="deldoc"){S.docs=S.docs.filter(x=>x.id!==d.d);ls.set("rev:"+S.cid+":docs",S.docs);render()}
  else if(a==="gen"){const l=genCloze(10);if(!l.length)S.msg={t:"warn",m:"Pas assez de texte dans le cours. Ajoute un document dans l'onglet Cours."};else{addCustom(l);S.msg={t:"ok",m:l.length+" questions à trous ajoutées."}}render()}
  else if(a==="addmanual")addManual();
  else if(a==="copyprompt"){navigator.clipboard.writeText(PROMPT).then(()=>{b.textContent="Copié"}).catch(()=>{const t=document.getElementById("promptBox");t.select();b.textContent="Sélectionné : copie avec Ctrl/Cmd + C"})}
  else if(a==="copymine"){const t=JSON.stringify(ls.get("rev:"+S.cid+":custom")||[],null,1);navigator.clipboard.writeText(t).then(()=>{b.textContent="Copié"}).catch(()=>{b.textContent="Copie impossible"})}
  else if(a==="delmine"){if(b.dataset.sure){ls.set("rev:"+S.cid+":custom",[]);S.qs=S.qs.filter(q=>q.source!=="import");S.msg=null;render()}else{b.dataset.sure="1";b.textContent="Cliquer encore pour confirmer"}}
  else if(a==="test")start(pick(Number(d.n)||10),false);
  else if(a==="exam")start(active().filter(q=>q.type!=="open"),true);
  else if(a==="open-q")startOpen();
  else if(a==="pick"){const it=S.run.items[S.run.i],oi=Number(d.oi);it.picks=it.q.type==="multi"?(it.picks.includes(oi)?it.picks.filter(x=>x!==oi):[...it.picks,oi]):[oi];render()}
  else if(a==="next"){S.run.i++;render()}
  else if(a==="prev"){S.run.i--;render()}
  else if(a==="finish")finish();
  else if(a==="retry")retry();
  else if(a==="quit"){S.run=null;S.atts=attsOf(S.cid);render()}
  else if(a==="reveal"){S.run.phase="check";render()}
  else if(a==="valid"){const r=S.run,f=r.checked.length/r.q.points.length;S.atts.unshift({at:Date.now(),mode:"open",n:1,score20:Math.round(f*20*2)/2,items:[{qid:r.q.id,f}]});saveAtts();r.phase="done";render()}
  else if(a==="flag"){if(!S.flag.includes(d.id))S.flag.push(d.id);ls.set("rev:"+S.cid+":flag",S.flag);b.textContent="Signalée";b.disabled=true}
  else if(a==="unflag"){S.flag=[];ls.set("rev:"+S.cid+":flag",[]);render()}
  else if(a==="reset"){if(b.dataset.sure){S.atts=[];saveAtts();render()}else{b.dataset.sure="1";b.textContent="Cliquer encore pour confirmer"}}
});
fetch("courses/index.json",{cache:"no-cache"}).then(r=>r.json()).then(c=>{S.repoCourses=c;loadCourses();render()}).catch(()=>{S.repoCourses=[];loadCourses();render()});
</script></body></html>
